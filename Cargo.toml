[workspace]
resolver = "2"

members = [
    "crates/dilithia-guard",
    "crates/dilithia-crypto",
    "crates/dilithia-serialization",
    "crates/dilithia-core",
    "crates/dilithia-consensus",
    "crates/dilithia-p2p",
    "crates/dilithia-node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
authors = ["Dilithia Network Contributors"]
license = "MIT OR Apache-2.0"

[profile.dev]
panic = "unwind"
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
